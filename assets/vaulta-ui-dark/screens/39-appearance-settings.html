.t{display:block;font-size:15px;font-weight:500}
.s{display:block;font-size:12px;color:#8D96A5;margin-top:2px}
.sw{width:48px;height:28px;border-radius:14px;border:0;position:relative;padding:0;cursor:pointer;flex-shrink:0;margin-left:auto;transition:background .15s}
.sw span{position:absolute;top:3px;width:22px;height:22px;border-radius:11px;background:#ffffff;box-shadow:0 1px 2px rgba(0,0,0,0.90);transition:left .15s}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
