<style>

<div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 8px">
<h1 style="font-size: 28px; font-weight: 700; letter-spacing: -0.03em">Add recipient</h1>
<p class="mut" style="font-size: 15px; line-height: 1.5">We’ll confirm the account name before you send anything.</p>
</div>
<div style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 16px">
<div>
<span class="lbl" id="bk">Bank</span>
<button aria-labelledby="bk" style="width: 100%; height: 52px; border: 1px solid #D0D5DD; border-radius: 12px; background: #FFFFFF; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-size: 16px; color: #101828; text-align: left; cursor: pointer">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #F2F4F7; color: #344054; display: flex; align-items: center; justify-content: center"><svg class="i" height="16" viewbox="0 0 24 24" width="16"><path d="M3 10 12 4l9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"></path></svg></span>
<span style="flex: 1">Guaranty Trust Bank</span>
<svg class="i" height="18" style="color: #667085" viewbox="0 0 24 24" width="18"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>
<div>
<label class="lbl" for="an">Account number</label>
<div style="position: relative">
<input class="in" id="an" inputmode="numeric" style="border-color: #16A875; letter-spacing: 0.06em; padding-right: 48px" value="0123456789"/>
<span style="position: absolute; right: 14px; top: 15px; width: 22px; height: 22px; border-radius: 11px; background: #16A875; color: #101828; display: flex; align-items: center; justify-content: center"><svg class="i" height="13" style="stroke-width: 3" viewbox="0 0 24 24" width="13"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
</div>
<p class="mut" style="font-size: 12px; margin-top: 6px">10 of 10 digits</p>
</div>
<div role="status" style="display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 14px; background: #EAF8F1; border: 1px solid #A6E6C9">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; color: #0E7F57; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">TB</span>
<span style="flex: 1">
<span style="display: block; font-size: 12px; font-weight: 600; color: #0E7F57">Account verified</span>
<span style="display: block; font-size: 15px; font-weight: 600; margin-top: 2px; letter-spacing: 0.01em">TUNDE ADEWALE BAKARE</span>
</span>
</div>
<div>
<label class="lbl" for="nn">Nickname <span class="mut" style="font-weight: 400">(optional)</span></label>
<input class="in" id="nn" value="Tunde"/>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 14px">
<span><span id="sv" style="display: block; font-size: 15px; font-weight: 500">Save as beneficiary</span><span class="mut" style="display: block; font-size: 13px; margin-top: 2px">Find Tunde faster next time</span></span>
<button aria-checked="true" aria-labelledby="sv" class="sw" role="switch" style="background: #16A875"><span style="left: 23px"></span></button>
</div>
</div>
<div style="margin-top: auto; padding: 0 20px 40px"><a class="btn bp" href="19-enter-amount.html">Continue</a></div>
<div class="hb"></div>
