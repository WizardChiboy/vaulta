<style>
body{margin:0}

button,input{font-family:inherit}
.v{width:393px;height:852px;background:#F5F7FA;font-family:'Inter',system-ui,sans-serif;color:#101828;position:relative;overflow:hidden;display:flex;flex-direction:column}
.sb{height:50px;flex-shrink:0;padding:16px 26px 0 34px;display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.hb{position:absolute;bottom:8px;left:129px;width:134px;height:5px;border-radius:3px;background:#101828}
.hd{height:56px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 20px}
.ib{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid #E4E7EC;color:#101828;cursor:pointer;padding:0}
.card{background:#FFFFFF;border:1px solid #E4E7EC;border-radius:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;width:100%;border-radius:14px;font-size:16px;font-weight:600;border:0;cursor:pointer;text-decoration:none}
.bp{background:#16A875;color:#101828}.bp:hover{background:#13965F;color:#101828}
.bs{background:#FFFFFF;color:#101828;border:1px solid #D0D5DD}.bs:hover{color:#101828;background:#F9FAFB}
.bd{background:#E4E7EC;color:#667085;cursor:not-allowed}
.lbl{display:block;font-size:13px;font-weight:500;color:#344054;margin-bottom:6px}
.in{width:100%;height:52px;border:1px solid #D0D5DD;border-radius:12px;padding:0 14px;font-size:16px;color:#101828;background:#FFFFFF;outline:none}
.mut{color:#667085}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>

<style>
html{background:#E4E7EC}

body>.v{border-radius:44px;box-shadow:0 0 0 10px #101828,0 30px 60px rgba(16,24,40,.25)}

<p class="mut" style="margin-top: auto; padding-bottom: 44px; text-align: center; font-size: 14px">New to Vaulta? <a href="03-sign-up.html" style="font-weight: 600">Create an account</a></p>
